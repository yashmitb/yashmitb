<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Résumé — Yashmit Bhaverisetti, Data Science @ UC San Diego." />
    <meta name="theme-color" content="#08080a" />

    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
    <link rel="stylesheet" href="../assets/css/styles.css?v=20260714b" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />

    <title>Résumé — Yashmit Bhaverisetti</title>

    <style>
      .resume {
        min-height: 100svh;
        padding: calc(var(--nav-h) + 1.5rem) 0 4rem;
      }
      .resume__head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.8rem;
      }
      .resume__title {
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        font-weight: 800;
        letter-spacing: -0.035em;
        line-height: 1.05;
      }
      .resume__title span {
        color: var(--text-soft);
        font-weight: 500;
        display: block;
        font-size: 0.92rem;
        letter-spacing: 0;
        margin-top: 0.35rem;
      }
      .resume__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem;
      }
      .resume__viewer {
        border-radius: var(--radius-xl);
        padding: 0.8rem;
      }
      .pdf-pages {
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }
      .pdf-page {
        width: 100%;
        height: auto;
        display: block;
        border-radius: var(--radius-md);
        background: #fff;
        box-shadow: var(--shadow-sm);
      }
      .pdf-loading {
        padding: 4rem 1rem;
        text-align: center;
        color: var(--text-faint);
        font-size: 0.9rem;
      }
      .pdf-fallback {
        display: none;
        padding: 3rem 1rem;
        text-align: center;
        color: var(--text-soft);
      }
      .resume__hint {
        margin-top: 1rem;
        text-align: center;
        color: var(--text-faint);
        font-size: 0.85rem;
      }
      .resume__hint a {
        color: var(--text-soft);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      @media (max-width: 560px) {
        .resume__actions {
          width: 100%;
        }
        .resume__actions .btn {
          flex: 1;
        }
      }
    </style>
  </head>
  <body class="dark-theme">
    <div class="bg-orbs" aria-hidden="true">
      <span class="orb orb--1"></span>
      <span class="orb orb--2"></span>
      <span class="orb orb--3"></span>
    </div>

    <!-- Floating pill -->
    <nav class="nav" id="nav">
      <a href="../index.html" class="nav__logo"><span class="dot"></span>Yashmit</a>
      <div class="nav__right">
        <a href="../index.html" class="btn btn--ghost nav__cta">
          <i class="bx bx-arrow-back"></i> Back to site
        </a>
        <a
          href="../Yashmit_s_College_Resume.pdf"
          download="Yashmit_Bhaverisetti_Resume.pdf"
          class="btn btn--primary nav__cta"
        >
          <i class="bx bx-download"></i> Download
        </a>
      </div>
    </nav>

    <main class="resume wrap">
      <div class="resume__head">
        <h1 class="resume__title">
          Résumé
          <span>Yashmit Bhaverisetti — Data Science @ UC San Diego</span>
        </h1>
        <div class="resume__actions">
          <a
            href="../Yashmit_s_College_Resume.pdf"
            download="Yashmit_Bhaverisetti_Resume.pdf"
            class="btn btn--primary"
          >
            <i class="bx bx-download"></i> Download PDF
          </a>
          <a
            href="../Yashmit_s_College_Resume.pdf"
            target="_blank"
            rel="noopener"
            class="btn btn--ghost"
          >
            <i class="bx bx-link-external"></i> Open in new tab
          </a>
        </div>
      </div>

      <div class="resume__viewer glass reveal in">
        <div class="pdf-pages" id="pdf-pages">
          <div class="pdf-loading" id="pdf-loading">Loading résumé…</div>
        </div>
        <div class="pdf-fallback" id="pdf-fallback">
          Couldn't render the preview here.
          <a href="../Yashmit_s_College_Resume.pdf" target="_blank" rel="noopener"
            style="color: var(--text); text-decoration: underline">Open the PDF</a>
          or
          <a href="../Yashmit_s_College_Resume.pdf" download="Yashmit_Bhaverisetti_Resume.pdf"
            style="color: var(--text); text-decoration: underline">download it</a>.
        </div>
      </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      (function () {
        var URL_PDF = "../Yashmit_s_College_Resume.pdf";
        var pages = document.getElementById("pdf-pages");
        var loading = document.getElementById("pdf-loading");
        var fallback = document.getElementById("pdf-fallback");

        function fail() {
          if (loading) loading.remove();
          if (fallback) fallback.style.display = "block";
        }

        if (!window.pdfjsLib) {
          fail();
          return;
        }
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        var dpr = Math.min(window.devicePixelRatio || 1, 2);

        pdfjsLib
          .getDocument(URL_PDF)
          .promise.then(function (pdf) {
            if (loading) loading.remove();
            var chain = Promise.resolve();
            for (var i = 1; i <= pdf.numPages; i++) {
              (function (n) {
                chain = chain.then(function () {
                  return pdf.getPage(n).then(function (page) {
                    var base = page.getViewport({ scale: 1 });
                    var cw = pages.clientWidth || 800;
                    var vp = page.getViewport({ scale: (cw / base.width) * dpr });
                    var canvas = document.createElement("canvas");
                    canvas.className = "pdf-page";
                    canvas.width = Math.floor(vp.width);
                    canvas.height = Math.floor(vp.height);
                    pages.appendChild(canvas);
                    return page.render({
                      canvasContext: canvas.getContext("2d"),
                      viewport: vp,
                    }).promise;
                  });
                });
              })(i);
            }
            return chain;
          })
          .catch(fail);
      })();
    </script>

    <script>
      // keep theme consistent with the main site (falls back to system preference)
      try {
        var storedTheme = localStorage.getItem("theme");
        var wantsLight =
          storedTheme === "light" ||
          (!storedTheme && matchMedia("(prefers-color-scheme: light)").matches);
        if (wantsLight) {
          document.body.classList.remove("dark-theme");
          document.body.classList.add("light-theme");
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", "#f4f4f5");
        }
      } catch (e) {}
    </script>
  </body>
</html>
